name: identyclaw-a2a
label: IdentyClaw A2A
kind: platform
version: 0.1.0
description: >
  Overlay for Hermes bundled A2A: Passport JWT inbound auth (token_id identity),
  /api/login + /api/login/timestamp for peer login_server, and outbound a2a_call
  that mints per-peer JWTs via the identyclaw-auth sidecar.

  Plugin id is identyclaw-a2a (unique — do not reuse bundled yaml name
  a2a-platform, or `hermes plugins enable` resolves to platforms/a2a).
  After install: `hermes plugins disable platforms/a2a` then
  `hermes plugins enable identyclaw-a2a --allow-tool-override`.
author: Discernible IO
manifest_version: 2
api_version: 1
capabilities:
  - tools.override
provides_tools:
  - a2a_discover
  - a2a_call
  - a2a_list
  - a2a_history
  - a2a_orchestrate
requires_plugins:
  - id: identyclaw-auth
    version_range: ">=0.2.0"
requires_env: []
optional_env:
  - name: IDENTYCLAW_AUTH_PORT
    description: "Localhost auth sidecar port (default 9910). Enable identyclaw-auth and run `hermes identyclaw sidecar start` first."
    prompt: "IdentyClaw auth sidecar port"
    password: false
  - name: A2A_PUBLIC_URL
    description: "Public HTTPS base URL (Agent Card / discovery). JWT aud comes from RoditClient."
    prompt: "Public A2A / webhook base URL"
    password: false
  - name: A2A_PORT
    description: "Inbound A2A server port (default 9900)."
    prompt: "A2A port"
    password: false
  - name: A2A_HOST
    description: "Bind host (Passport JWT auth allows remote bind when passport loads)."
    prompt: "A2A bind host"
    password: false
  - name: IDENTYCLAW_JWT_AUDIENCE
    description: "Optional override only — prefer RoditClient.getConfigOwnRodit().own_rodit.owner_id."
    prompt: "(optional) JWT audience override"
    password: false
